name: ckp
services:
  api:
    build:
      context: ../ckp-server
    env_file: .env.server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DEV_DB: off
      COOKIE_SECURE: 'true'
      TRUST_PROXY: '1'
      PUBLIC_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      CORS_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/v1/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      options: { max-size: 10m, max-file: '3' }
  web:
    build:
      context: ../ckp-app
      dockerfile: ../deploy/Dockerfile.web
      args:
        PUBLIC_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging:
      options: { max-size: 10m, max-file: '3' }
volumes:
  caddy_data:
  caddy_config:
